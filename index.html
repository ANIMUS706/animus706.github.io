<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برنامه مطالعه کنکور</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #070b16;
            --card: rgba(17, 24, 39, 0.78);
            --card2: rgba(15, 23, 42, 0.72);

            --primary: #7c3aed;
            --primary2: #4f46e5;
            --cyan: #06b6d4;
            --green: #22c55e;
            --red: #ef4444;

            --text: #f8fafc;
            --muted: #94a3b8;
            --light: #cbd5e1;

            --border: rgba(255,255,255,.08);
            --shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Vazirmatn", Tahoma, sans-serif;

            min-height: 100vh;
            padding: 30px 15px;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(124,58,237,.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(6,182,212,.15),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(236,72,153,.12),
                    transparent 35%
                ),
                var(--bg);
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: auto;
        }

        /* HEADER */

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 22px;

            font-size: 34px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,58,237,.3),
                    rgba(6,182,212,.15)
                );

            border: 1px solid rgba(167,139,250,.25);

            box-shadow:
                0 0 40px rgba(124,58,237,.25);
        }

        header h1 {
            font-size: clamp(28px,5vw,44px);
            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #c4b5fd,
                    #818cf8,
                    #22d3ee
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 8px;
        }

        header p {
            color: var(--muted);
            font-size: 13px;
        }

        /* GLASS */

        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ADD FORM */

        .add-section {
            padding: 25px;
            border-radius: 24px;
            margin-bottom: 25px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 22px;
        }

        .section-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: rgba(124,58,237,.15);

            font-size: 20px;
        }

        .section-title h2 {
            font-size: 19px;
        }

        .section-title span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        #studyForm {
            display: grid;
            grid-template-columns: repeat(6,1fr);
            gap: 13px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            color: var(--light);
            font-size: 11px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            height: 47px;

            padding: 0 12px;

            color: white;

            background: rgba(15,23,42,.85);

            border: 1px solid rgba(148,163,184,.14);

            border-radius: 11px;

            outline: none;

            font-family: inherit;
            font-size: 12px;

            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(124,58,237,.12);
        }

        select option {
            background: #111827;
        }

        .add-btn {
            height: 47px;

            border: none;
            border-radius: 11px;

            color: white;

            font-family: inherit;
            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            transition: .25s;

            grid-column: span 2;
        }

        .add-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(124,58,237,.35);
        }

        /* PERIOD */

        .period-section {
            margin-bottom: 25px;
        }

        .period-buttons {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 10px;
        }

        .period-btn {
            height: 50px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: var(--card);
            color: var(--muted);

            font-family: inherit;
            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .period-btn:hover {
            color: white;
        }

        .period-btn.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,58,237,.8),
                    rgba(79,70,229,.8)
                );

            border-color: rgba(167,139,250,.4);

            box-shadow:
                0 8px 25px rgba(124,58,237,.2);
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 14px;

            margin-bottom: 25px;
        }

        .stat-card {
            padding: 20px;

            text-align: center;

            border-radius: 19px;

            background: var(--card);

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .stat-value {
            display: block;

            font-size: 25px;
            font-weight: 900;

            color: #c4b5fd;

            margin-bottom: 4px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 11px;
        }

        /* PROGRESS */

        .progress-box {
            padding: 20px;

            border-radius: 18px;

            background: rgba(17,24,39,.6);

            border: 1px solid var(--border);

            margin-bottom: 25px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 12px;
            font-weight: 800;
        }

        .progress-bar {
            height: 10px;

            overflow: hidden;

            border-radius: 50px;

            background: rgba(15,23,42,.9);
        }

        .progress-fill {
            height: 100%;
            width: 0%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #8b5cf6,
                    #22d3ee
                );

            transition: width .5s;
        }

        /* REPORT */

        .report {
            padding: 22px;

            border-radius: 20px;

            background: var(--card);

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            margin-bottom: 25px;
        }

        .report-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .report-title h2 {
            font-size: 18px;
        }

        .report-title span {
            color: var(--muted);
            font-size: 11px;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            gap: 7px;

            height: 210px;

            padding-top: 20px;

            overflow-x: auto;
        }

        .chart-item {
            min-width: 34px;

            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;

            gap: 5px;
        }

        .chart-value {
            font-size: 9px;
            color: #c4b5fd;
        }

        .chart-bar-wrapper {
            width: 25px;
            height: 150px;

            display: flex;
            align-items: flex-end;

            background: rgba(15,23,42,.5);

            border-radius: 7px;

            overflow: hidden;
        }

        .chart-bar {
            width: 100%;

            min-height: 2px;

            border-radius: 7px;

            background:
                linear-gradient(
                    to top,
                    #7c3aed,
                    #22d3ee
                );

            transition: height .4s;
        }

        .chart-label {
            font-size: 8px;
            color: var(--muted);
            white-space: nowrap;
        }

        /* HISTORY */

        .history {
            margin-bottom: 25px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .history-header h2 {
            font-size: 20px;
        }

        .history-header span {
            color: var(--muted);
            font-size: 11px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            border-radius: 13px;

            background: rgba(17,24,39,.7);

            border: 1px solid var(--border);
        }

        .history-check {
            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 7px;

            background: rgba(124,58,237,.15);

            cursor: pointer;

            flex-shrink: 0;
        }

        .history-check.done {
            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-subject {
            font-weight: 800;
            font-size: 13px;
        }

        .history-topic {
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }

        .history-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;

            gap: 3px;

            white-space: nowrap;
        }

        .history-duration {
            color: #c4b5fd;
            font-size: 11px;
            font-weight: 800;
        }

        .history-date {
            color: #67e8f9;
            font-size: 10px;
        }

        .delete-btn {
            width: 31px;
            height: 31px;

            border: none;
            border-radius: 8px;

            background: rgba(239,68,68,.08);
            color: #f87171;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: rgba(239,68,68,.2);
        }

        .empty {
            padding: 35px;

            text-align: center;

            color: var(--muted);

            background: rgba(17,24,39,.5);

            border-radius: 15px;
        }

        /* CLEAR */

        .clear-btn {
            display: block;

            margin: 0 auto;

            padding: 12px 20px;

            border-radius: 10px;

            border: 1px solid rgba(239,68,68,.2);

            background: rgba(239,68,68,.07);

            color: #f87171;

            font-family: inherit;
            font-weight: 700;

            cursor: pointer;
        }

        /* MOBILE */

        @media(max-width:900px) {

            #studyForm {
                grid-template-columns: repeat(3,1fr);
            }

            .add-btn {
                grid-column: span 3;
            }

            .stats {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width:600px) {

            body {
                padding: 20px 10px;
            }

            #studyForm {
                grid-template-columns: 1fr;
            }

            .add-btn {
                grid-column: span 1;
            }

            .period-buttons {
                grid-template-columns: repeat(2,1fr);
            }

            .stats {
                grid-template-columns: repeat(2,1fr);
                gap: 9px;
            }

            .stat-card {
                padding: 15px 8px;
            }

            .history-item {
                gap: 8px;
            }

            .history-meta {
                font-size: 9px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <div class="logo">
            📚
        </div>

        <h1>
            برنامه مطالعه کنکور
        </h1>

        <p>
            مطالعه‌هات رو ثبت کن و پیشرفتت رو در طول زمان ببین 🚀
        </p>

    </header>


    <!-- ADD STUDY -->

    <section class="add-section glass">

        <div class="section-title">

            <div class="section-icon">
                ➕
            </div>

            <div>

                <h2>
                    ثبت مطالعه
                </h2>

                <span>
                    مدت مطالعه به صورت خودکار محاسبه می‌شود
                </span>

            </div>

        </div>


        <form id="studyForm">

            <div class="form-group">

                <label>
                    تاریخ
                </label>

                <input
                    type="date"
                    id="studyDate"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    درس
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="مثلاً ریاضی"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    مبحث
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="مثلاً تابع"
                >

            </div>


            <div class="form-group">

                <label>
                    ساعت شروع
                </label>

                <input
                    type="time"
                    id="startTime"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    ساعت پایان
                </label>

                <input
                    type="time"
                    id="endTime"
                    required
                >

            </div>


            <button
                class="add-btn"
                type="submit"
            >
                ✨ ثبت مطالعه
            </button>

        </form>

    </section>


    <!-- PERIOD -->

    <section class="period-section">

        <div class="period-buttons">

            <button
                class="period-btn active"
                data-period="today"
            >
                📅 امروز
            </button>

            <button
                class="period-btn"
                data-period="week"
            >
                📆 این هفته
            </button>

            <button
                class="period-btn"
                data-period="month"
            >
                🗓️ این ماه
            </button>

            <button
                class="period-btn"
                data-period="year"
            >
                📊 امسال
            </button>

        </div>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                ⏱️
            </div>

            <strong
                class="stat-value"
                id="totalMinutes"
            >
                ۰ دقیقه
            </strong>

            <span class="stat-label">
                مجموع مطالعه
            </span>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📚
            </div>

            <strong
                class="stat-value"
                id="totalSessions"
            >
                ۰
            </strong>

            <span class="stat-label">
                تعداد جلسات
            </span>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ✅
            </div>

            <strong
                class="stat-value"
                id="completedSessions"
            >
                ۰
            </strong>

            <span class="stat-label">
                انجام شده
            </span>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📅
            </div>

            <strong
                class="stat-value"
                id="activeDays"
            >
                ۰
            </strong>

            <span class="stat-label">
                روزهای فعال
            </span>

        </div>

    </section>


    <!-- PROGRESS -->

    <section class="progress-box">

        <div class="progress-header">

            <span>
                درصد انجام مطالعه‌ها
            </span>

            <span id="progressText">
                ۰٪
            </span>

        </div>

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

    </section>


    <!-- REPORT -->

    <section class="report">

        <div class="report-title">

            <h2>
                📈 گزارش مطالعه
            </h2>

            <span id="reportDescription">
                امروز
            </span>

        </div>

        <div
            class="chart"
            id="chart"
        ></div>

    </section>


    <!-- HISTORY -->

    <section class="history">

        <div class="history-header">

            <h2>
                📚 تاریخچه مطالعه
            </h2>

            <span id="historyCount">
                ۰ مطالعه
            </span>

        </div>


        <div
            class="history-list"
            id="historyList"
        ></div>

    </section>


    <!-- CLEAR -->

    <button
        class="clear-btn"
        id="clearAll"
        type="button"
    >
        🗑️ پاک کردن تمام تاریخچه
    </button>

</div>


<script>

    /* =========================
       Elements
    ========================= */

    const form =
        document.getElementById("studyForm");

    const studyDate =
        document.getElementById("studyDate");

    const subjectInput =
        document.getElementById("subject");

    const topicInput =
        document.getElementById("topic");

    const startTimeInput =
        document.getElementById("startTime");

    const endTimeInput =
        document.getElementById("endTime");


    const totalMinutesElement =
        document.getElementById("totalMinutes");

    const totalSessionsElement =
        document.getElementById("totalSessions");

    const completedSessionsElement =
        document.getElementById("completedSessions");

    const activeDaysElement =
        document.getElementById("activeDays");

    const progressText =
        document.getElementById("progressText");

    const progressFill =
        document.getElementById("progressFill");

    const historyList =
        document.getElementById("historyList");

    const historyCount =
        document.getElementById("historyCount");

    const chart =
        document.getElementById("chart");

    const reportDescription =
        document.getElementById("reportDescription");

    const clearAll =
        document.getElementById("clearAll");


    /* =========================
       Storage
    ========================= */

    let studyTasks = [];

    try {

        const saved =
            localStorage.getItem(
                "konkurStudyHistory"
            );

        if (saved) {

            studyTasks =
                JSON.parse(saved);

        }

    } catch {

        studyTasks = [];

    }


    function saveTasks() {

        localStorage.setItem(
            "konkurStudyHistory",
            JSON.stringify(studyTasks)
        );

    }


    /* =========================
       Date
    ========================= */

    function getToday() {

        const date =
            new Date();

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2,"0");

        const day =
            String(
                date.getDate()
            ).padStart(2,"0");

        return `${year}-${month}-${day}`;

    }


    studyDate.value =
        getToday();


    /* =========================
       Duration
    ========================= */

    function calculateMinutes(
        start,
        end
    ) {

        const startParts =
            start.split(":").map(Number);

        const endParts =
            end.split(":").map(Number);


        const startMinutes =
            startParts[0] * 60 +
            startParts[1];

        const endMinutes =
            endParts[0] * 60 +
            endParts[1];


        return endMinutes -
            startMinutes;

    }


    function formatDuration(
        minutes
    ) {

        minutes =
            Math.round(minutes);


        if (minutes < 60) {

            return `${minutes} دقیقه`;

        }


        const hours =
            Math.floor(
                minutes / 60
            );

        const remaining =
            minutes % 60;


        if (remaining === 0) {

            return `${hours} ساعت`;

        }


        return `${hours} ساعت و ${remaining} دقیقه`;

    }


    /* =========================
       Add Study
    ========================= */

    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const date =
                studyDate.value;

            const subject =
                subjectInput.value.trim();

            const topic =
                topicInput.value.trim();

            const start =
                startTimeInput.value;

            const end =
                endTimeInput.value;


            if (!date) {

                alert(
                    "لطفاً تاریخ را انتخاب کن."
                );

                return;

            }


            if (!subject) {

                alert(
                    "لطفاً نام درس را وارد کن."
                );

                subjectInput.focus();

                return;

            }


            if (!start || !end) {

                alert(
                    "لطفاً ساعت شروع و پایان را وارد کن."
                );

                return;

            }


            const minutes =
                calculateMinutes(
                    start,
                    end
                );


            if (minutes <= 0) {

                alert(
                    "ساعت پایان باید بعد از ساعت شروع باشد."
                );

                endTimeInput.focus();

                return;

            }


            const newTask = {

                id:
                    Date.now() +
                    Math.random(),

                date:
                    date,

                subject:
                    subject,

                topic:
                    topic,

                startTime:
                    start,

                endTime:
                    end,

                minutes:
                    minutes,

                completed:
                    false

            };


            studyTasks.push(
                newTask
            );


            saveTasks();


            form.reset();


            studyDate.value =
                getToday();


            renderAll();

        }
    );


    /* =========================
       Period
    ========================= */

    let currentPeriod =
        "today";


    document
        .querySelectorAll(".period-btn")
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(".period-btn")
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        currentPeriod =
                            button.dataset.period;


                        renderAll();

                    }
                );

            }
        );


    /* =========================
       Date Helpers
    ========================= */

    function parseDate(
        dateString
    ) {

        const [
            year,
            month,
            day
        ] =
            dateString
                .split("-")
                .map(Number);


        return new Date(
            year,
            month - 1,
            day
        );

    }


    function isSameDay(
        date
    ) {

        const today =
            new Date();


        return (
            date.getFullYear() ===
            today.getFullYear() &&

            date.getMonth() ===
            today.getMonth() &&

            date.getDate() ===
            today.getDate()
        );

    }


    function isThisWeek(
        date
    ) {

        const today =
            new Date();


        const day =
            today.getDay();


        const diff =
            day === 0
                ? 6
                : day - 1;


        const monday =
            new Date(today);

        monday.setHours(
            0,0,0,0
        );

        monday.setDate(
            today.getDate() - diff
        );


        const sunday =
            new Date(monday);

        sunday.setDate(
            monday.getDate() + 6
        );

        sunday.setHours(
            23,59,59,999
        );


        return (
            date >= monday &&
            date <= sunday
        );

    }


    function isThisMonth(
        date
    ) {

        const today =
            new Date();


        return (
            date.getFullYear() ===
            today.getFullYear() &&

            date.getMonth() ===
            today.getMonth()
        );

    }


    function isThisYear(
        date
    ) {

        const today =
            new Date();


        return (
            date.getFullYear() ===
            today.getFullYear()
        );

    }


    function getFilteredTasks() {

        return studyTasks.filter(
            function(task) {

                const date =
                    parseDate(
                        task.date
                    );


                if (
                    currentPeriod ===
                    "today"
                ) {

                    return isSameDay(date);

                }


                if (
                    currentPeriod ===
                    "week"
                ) {

                    return isThisWeek(date);

                }


                if (
                    currentPeriod ===
                    "month"
                ) {

                    return isThisMonth(date);

                }


                if (
                    currentPeriod ===
                    "year"
                ) {

                    return isThisYear(date);

                }


                return true;

            }
        );

    }


    /* =========================
       Stats
    ========================= */

    function updateStats() {

        const tasks =
            getFilteredTasks();


        const totalMinutes =
            tasks.reduce(
                function(total, task) {

                    return total +
                        Number(
                            task.minutes || 0
                        );

                },
                0
            );


        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;


        const activeDays =
            new Set(
                tasks.map(
                    task =>
                        task.date
                )
            ).size;


        let percentage =
            0;


        if (
            tasks.length > 0
        ) {

            percentage =
                Math.round(
                    (
                        completed /
                        tasks.length
                    ) * 100
                );

        }


        totalMinutesElement.textContent =
            formatDuration(
                totalMinutes
            );


        totalSessionsElement.textContent =
            tasks.length;


        completedSessionsElement.textContent =
            completed;


        activeDaysElement.textContent =
            activeDays;


        progressText.textContent =
            `${percentage}٪`;


        progressFill.style.width =
            `${percentage}%`;

    }


    /* =========================
       Report Text
    ========================= */

    function updateReportTitle() {

        const titles = {

            today:
                "امروز",

            week:
                "این هفته",

            month:
                "این ماه",

            year:
                "امسال"

        };


        reportDescription.textContent =
            titles[currentPeriod];

    }


    /* =========================
       Chart
    ========================= */

    function renderChart() {

        chart.innerHTML =
            "";


        const tasks =
            getFilteredTasks();


        if (
            tasks.length === 0
        ) {

            chart.innerHTML =
                `<div class="empty">
                    هنوز مطالعه‌ای در این بازه ثبت نشده.
                </div>`;

            return;

        }


        const grouped = {};


        tasks.forEach(
            function(task) {

                if (
                    !grouped[task.date]
                ) {

                    grouped[task.date] =
                        0;

                }


                grouped[task.date] +=
                    Number(
                        task.minutes || 0
                    );

            }
        );


        const dates =
            Object.keys(grouped)
                .sort();


        const max =
            Math.max(
                ...Object.values(
                    grouped
                )
            );


        dates.forEach(
            function(date) {

                const minutes =
                    grouped[date];


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "chart-item";


                const value =
                    document.createElement(
                        "div"
                    );

                value.className =
                    "chart-value";

                value.textContent =
                    formatDuration(
                        minutes
                    );


                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "chart-bar-wrapper";


                const bar =
                    document.createElement(
                        "div"
                    );

                bar.className =
                    "chart-bar";


                const height =
                    max > 0
                        ? (
                            minutes /
                            max
                        ) * 100
                        : 0;


                bar.style.height =
                    `${height}%`;


                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "chart-label";


                const parts =
                    date.split("-");


                label.textContent =
                    `${parts[2]}/${parts[1]}`;


                wrapper.appendChild(
                    bar
                );


                item.appendChild(
                    value
                );

                item.appendChild(
                    wrapper
                );

                item.appendChild(
                    label
                );


                chart.appendChild(
                    item
                );

            }
        );

    }


    /* =========================
       History
    ========================= */

    function renderHistory() {

        const tasks =
            [...getFilteredTasks()]
                .sort(
                    function(a,b) {

                        return (
                            b.date.localeCompare(
                                a.date
                            ) ||
                            b.startTime.localeCompare(
                                a.startTime
                            )
                        );

                    }
                );


        historyList.innerHTML =
            "";


        historyCount.textContent =
            `${tasks.length} مطالعه`;


        if (
            tasks.length === 0
        ) {

            historyList.innerHTML =
                `<div class="empty">
                    در این بازه هنوز مطالعه‌ای ثبت نشده.
                </div>`;

            return;

        }


        tasks.forEach(
            function(task) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "history-item";


                /* CHECK */

                const check =
                    document.createElement(
                        "div"
                    );

                check.className =
                    "history-check";


                if (
                    task.completed
                ) {

                    check.classList.add(
                        "done"
                    );

                }


                check.textContent =
                    task.completed
                        ? "✓"
                        : "○";


                check.title =
                    "تغییر وضعیت";


                check.addEventListener(
                    "click",
                    function() {

                        task.completed =
                            !task.completed;


                        saveTasks();

                        renderAll();

                    }
                );


                /* INFO */

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "history-info";


                const subject =
                    document.createElement(
                        "div"
                    );

                subject.className =
                    "history-subject";

                subject.textContent =
                    task.subject;


                info.appendChild(
                    subject
                );


                if (
                    task.topic
                ) {

                    const topic =
                        document.createElement(
                            "div"
                        );

                    topic.className =
                        "history-topic";

                    topic.textContent =
                        task.topic;


                    info.appendChild(
                        topic
                    );

                }


                /* META */

                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "history-meta";


                const duration =
                    document.createElement(
                        "span"
                    );

                duration.className =
                    "history-duration";

                duration.textContent =
                    formatDuration(
                        task.minutes
                    );


                const date =
                    document.createElement(
                        "span"
                    );

                date.className =
                    "history-date";

                date.textContent =
                    `${task.date} | ${task.startTime} تا ${task.endTime}`;


                meta.appendChild(
                    duration
                );

                meta.appendChild(
                    date
                );


                /* DELETE */

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete-btn";

                deleteButton.type =
                    "button";

                deleteButton.textContent =
                    "🗑️";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        const confirmed =
                            confirm(
                                `آیا می‌خواهی مطالعه «${task.subject}» حذف شود؟`
                            );


                        if (
                            !confirmed
                        ) {

                            return;

                        }


                        studyTasks =
                            studyTasks.filter(
                                item =>
                                    item.id !==
                                    task.id
                            );


                        saveTasks();

                        renderAll();

                    }
                );


                item.appendChild(
                    check
                );

                item.appendChild(
                    info
                );

                item.appendChild(
                    meta
                );

                item.appendChild(
                    deleteButton
                );


                historyList.appendChild(
                    item
                );

            }
        );

    }


    /* =========================
       Clear All
    ========================= */

    clearAll.addEventListener(
        "click",
        function() {

            if (
                studyTasks.length === 0
            ) {

                alert(
                    "تاریخچه‌ای برای پاک کردن وجود ندارد."
                );

                return;

            }


            const confirmed =
                confirm(
                    "⚠️ تمام تاریخچه مطالعه پاک می‌شود. مطمئنی؟"
                );


            if (
                !confirmed
            ) {

                return;

            }


            studyTasks =
                [];


            saveTasks();

            renderAll();

        }
    );


    /* =========================
       Render All
    ========================= */

    function renderAll() {

        updateStats();

        updateReportTitle();

        renderChart();

        renderHistory();

    }


    /* =========================
       Initial
    ========================= */

    renderAll();

</script>
